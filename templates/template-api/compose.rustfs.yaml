# Opt in: docker compose --env-file .env.rustfs -f compose.yaml -f compose.rustfs.yaml up -d --build
services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    command: ['/data']
    environment:
      RUSTFS_ACCESS_KEY: ${ACCESS_KEY_ID:?Configure ACCESS_KEY_ID for RustFS}
      RUSTFS_SECRET_KEY: ${SECRET_ACCESS_KEY:?Configure SECRET_ACCESS_KEY for RustFS}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CORS_ALLOWED_ORIGINS: ${STORAGE_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - '127.0.0.1:${RUSTFS_S3_PORT:-9000}:9000'
      - '127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  rustfs-init:
    platform: linux/amd64
    image: ${API_IMAGE:-vite-plus-template-api}
    build:
      context: ../..
      dockerfile: templates/template-api/Dockerfile
    command: [node, scripts/init-object-storage.ts]
    environment:
      STORAGE_PROVIDER: rustfs
      ENDPOINT: http://rustfs:9000
      ACCESS_KEY_ID: ${ACCESS_KEY_ID:?Configure ACCESS_KEY_ID for RustFS}
      SECRET_ACCESS_KEY: ${SECRET_ACCESS_KEY:?Configure SECRET_ACCESS_KEY for RustFS}
      BUCKET_NAME: ${BUCKET_NAME:-app-files}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_CORS_ALLOWED_ORIGINS: ${STORAGE_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      rustfs:
        condition: service_healthy
    restart: 'no'

  api:
    environment:
      STORAGE_PROVIDER: rustfs
      ENDPOINT: http://rustfs:9000
      BUCKET_NAME: ${BUCKET_NAME:-app-files}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_PRESIGN_ENDPOINT: ${STORAGE_PRESIGN_ENDPOINT:-http://localhost:${RUSTFS_S3_PORT:-9000}}
    depends_on:
      rustfs-init:
        condition: service_completed_successfully

volumes:
  rustfs_data:
