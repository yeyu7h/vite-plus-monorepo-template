<style data-app-loading="inject-css">
  #__app-loading__ {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    color: #64748b;
    background: #f8fafc;
    opacity: 1;
    transition:
      opacity 0.3s ease-out,
      visibility 0.3s ease-out;
  }

  #__app-loading__.hidden {
    pointer-events: none;
    visibility: hidden;
    opacity: 0;
  }

  .dark #__app-loading__ {
    color: #94a3b8;
    background: #0d0d10;
  }

  #__app-loading__ svg {
    width: 36px;
    height: 36px;
    animation: app-loading-spin 0.8s linear infinite;
  }

  #__app-loading__ circle {
    fill: none;
    stroke: currentColor;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 72;
    stroke-dashoffset: 54;
  }

  @keyframes app-loading-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>

<div id="__app-loading__" role="status" aria-label="<%= VITE_APP_TITLE %> 正在加载">
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="12" />
  </svg>
</div>
