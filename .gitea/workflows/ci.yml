name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ready:
    name: Check, test and build
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Validate workspace and generated templates
        run: corepack pnpm run ready
